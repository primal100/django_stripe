name: Django Stripe package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python }} / ${{ matrix.django }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.11', django: 'Django>=5.2,<5.3', dependencies: baseline}
          - {python: '3.12', django: 'Django>=5.2,<5.3', dependencies: baseline}
          - {python: '3.12', django: 'Django>=6.0,<6.1', dependencies: baseline}
          - {python: '3.13', django: 'Django>=6.0,<6.1', dependencies: baseline}
          - {python: '3.14', django: 'Django>=6.1.3,<6.2', dependencies: baseline}
          - {python: '3.15', django: 'Django>=6.1.3,<6.2', dependencies: baseline}
          - {python: '3.14', django: 'Django>=6.1.3,<6.2', dependencies: latest}
    env:
      PIP_CONSTRAINT: ${{ matrix.dependencies == 'baseline' && format('{0}/.github/constraints/baseline.txt', github.workspace) || '' }}
      DJANGO_REQUIREMENT: ${{ matrix.django }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/*.txt
      - name: Build and validate release archives
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_distribution.py
      - name: Install wheel with test dependencies
        run: |
          python -m pip install dist/*.whl 'django-stripe-subs[test]' "$DJANGO_REQUIREMENT"
          python -m pip check
      - name: Test installed wheel outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-tests"
          cp -R tests pytest.ini "$RUNNER_TEMP/wheel-tests/"
          cd "$RUNNER_TEMP/wheel-tests"
          python "$GITHUB_WORKSPACE/scripts/smoke_test_install.py"
          python -m pytest tests/unit -q

  integration:
    name: Live Stripe integration
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: django-stripe-live-integration
      cancel-in-progress: false
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLIC_KEY: ${{ secrets.STRIPE_TEST_PUBLIC_KEY }}
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints/baseline.txt
    steps:
      - name: Check test credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$STRIPE_TEST_SECRET_KEY" || -z "$STRIPE_TEST_PUBLIC_KEY" ]]; then
            echo 'Live Stripe tests skipped: configure both Stripe test secrets.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            python - <<'PY'
          import os
          assert os.environ['STRIPE_TEST_SECRET_KEY'].startswith(('sk_test_', 'rk_test_')), 'Test-mode secret key required'
          assert os.environ['STRIPE_TEST_PUBLIC_KEY'].startswith('pk_test_'), 'Test-mode public key required'
          PY
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/*.txt
      - name: Build and install wheel
        if: steps.credentials.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl 'django-stripe-subs[test]' 'Django>=6.1.3,<6.2'
          python -m pip check
      - name: Run integration tests against installed wheel
        if: steps.credentials.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/integration-tests"
          cp -R tests pytest.ini "$RUNNER_TEMP/integration-tests/"
          cd "$RUNNER_TEMP/integration-tests"
          python -m pytest tests/test_api.py tests/test_payments.py tests/test_views.py -q --tb=short
