[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-stripe-subs"
dynamic = ["version"]
description = "Easier management of subscriptions with Stripe in Django"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Paul Martin"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "django>=5.2,<6.2",
    "djangorestframework",
    "inflect",
    "stripe>=16",
    "stripe-subscriptions>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/primal100/django_stripe"
Source = "https://github.com/primal100/django_stripe"

[project.optional-dependencies]
test = ["pytest", "pytest-django", "pytest-selenium", "django-selenium-login"]
release = ["build", "twine"]

[tool.setuptools.dynamic]
version = {attr = "django_stripe.__version__"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["django_stripe", "django_stripe.*"]
namespaces = false

[tool.setuptools.package-data]
django_stripe = ["templates/**/*.html", "static/**/*"]
